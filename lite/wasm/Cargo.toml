[package]
name = "usmcc-lite"
version = "0.2.0"
edition = "2021"
publish = false
description = "The USMCC Publicity Helper's paper code (src-tauri/src/paper.rs), compiled to WebAssembly for Lite"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
